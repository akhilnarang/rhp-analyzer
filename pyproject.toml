[project]
name = "rhp-analyzer"
version = "0.1.0"
description = "Analyze Indian IPO RHP and DRHP files with page evidence"
readme = "README.md"
authors = [
    { name = "Akhil Narang", email = "me@akhilnarang.dev" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.0.0",
    "openai>=3.0.0",
    "pydantic-ai-slim[openai]>=2.28.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.1",
]

[project.scripts]
rhp-analyzer = "rhp_analyzer.cli:main"

[tool.fastapi]
entrypoint = "rhp_analyzer.api:app"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
